name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate paperly-release.jks keystore
        run: |
          keytool -genkeypair -v \
            -keystore paperly-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias paperly \
            -storepass 'Paperly2026!' \
            -keypass 'Paperly2026!' \
            -dname "CN=Paperly, OU=Mobile, O=Paperly Studio, L=Pune, ST=Maharashtra, C=IN"

          base64 -w 0 paperly-release.jks > keystore_base64.txt

          echo "Upload Key SHA-256 Fingerprint:"
          keytool -list -v -keystore paperly-release.jks -alias paperly -storepass 'Paperly2026!' | grep -E "SHA1:|SHA256:"

      - name: Upload Paperly-Keystore-Secret artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperly-Keystore-Secret
          path: keystore_base64.txt
          retention-days: 7
          if-no-files-found: error

      - name: Clean up generated keystore files
        if: always()
        run: rm -f paperly-release.jks keystore_base64.txt
